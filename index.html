function OPM(eid){var ed=eid!=null,p=ed?ED[ENV].P.find(function(x){return x.i===eid}):null;var b='<div class="fg"><label><span class="rq">*</span>内容池类型</label><select id="fTp" onchange="TPC()"><option value="normal"'+(ed&&p.tp!=='card'?' selected':'')+'>普通内容池</option><option value="card"'+(ed&&p.tp==='card'?' selected':'')+'>主题卡</option></select></div><div class="fg"><label><span class="rq">*</span>内容池标题</label><input id="fT" value="'+(ed?ES(p.t):'')+'" maxlength="20" placeholder="最长20个字"></div><div class="fg"><label><span class="rq">*</span>内容池ID</label><input id="fI" type="number" value="'+(ed?p.i:'')+'" min="0" max="1000000" placeholder="0-1000000"></div><div class="fg"><label id="fDesLb">内容池描述</label><textarea id="fDes" rows="3" maxlength="100" placeholder="选填，最长100字">'+(ed?ES(p.desc||''):'')+'</textarea></div><div class="fg"><label><span class="rq">*</span>分发方式</label><select id="fD"><option value="运营辅助推荐"'+(ed&&p.d==='运营辅助推荐'?' selected':'')+'>运营辅助推荐</option><option value="纯推荐"'+(ed&&p.d==='纯推荐'?' selected':'')+'>纯推荐</option></select></div><div class="fg"><label>生效时间区间</label><div class="rg"><label><input type="radio" name="fR" value="forever"'+(ed&&p.r==='forever'?' checked':'')+' onchange="TDR()"> 长期有效</label><label><input type="radio" name="fR" value="fixed"'+(ed&&p.r==='fixed'?' checked':'')+' onchange="TDR()"> 指定时间区间</label></div></div><div class="fr" id="fRF" style="display:'+(ed&&p.r==='fixed'?'flex':'none')+'"><div class="fg"><label>开始时间</label><input id="fS" type="datetime-local" value="'+(ed?p.s:'')+'"></div><div class="fg"><label>结束时间</label><input id="fE" type="datetime-local" value="'+(ed?p.e:'')+'"></div></div>';OM(ed?'编辑内容池':'新增内容池',b,'<button class="btn bdf" onclick="CL()">取消</button><button class="btn bp" onclick="SVP('+(ed?eid:'null')+')">保存</button>');TPC()}

function UPC(key){document.getElementById(key+'F').click()}function UCL(key){window['_'+key]='';document.getElementById(key+'P').innerHTML='<span>16:9 封面占位图</span>'}function UPL(key){var f=document.getElementById(key+'F').files[0];if(!f)return;var rd=new FileReader();rd.onload=function(e){window['_'+key]=e.target.result;document.getElementById(key+'P').innerHTML='<img src="'+e.target.result+'" style="width:100%;height:100%;object-fit:cover">'};rd.readAsDataURL(f)}
function SVP(eid){var t=$('#fT').value.trim(),id=parseInt($('#fI').value),d=$('#fD').value,tp=$('#fTp').value,ds=$('#fDes').value.trim();var dur=document.querySelector('input[name="fR"]:checked').value,st=$('#fS').value,et=$('#fE').value;if(!t)return TK('请输入标题','e');if(t.length>20)return TK('标题最长20字','e');if(isNaN(id)||id<0||id>1000000)return TK('ID需在0-1000000之间','e');if(dur==='fixed'&&(!st||!et))return TK('请填写时间区间','e');if(ED[ENV].P.find(function(p){return p.i===id&&p.i!==eid}))return TK('ID已存在','e');if(tp==='card'){if(!ds)return TK('请填写引导文案','e');if(ds.length>20)return TK('引导文案最长20字','e')}var n=N();if(eid!=null){var p=ED[ENV].P.find(function(x){return x.i===eid});Object.assign(p,{t:t,i:id,d:d,tp:tp,r:dur,s:dur==='fixed'?st:'',e:dur==='fixed'?et:'',u:n,desc:ds})}else{ED[ENV].P.push({i:id,t:t,d:d,tp:tp,r:dur,s:dur==='fixed'?st:'',e:dur==='fixed'?et:'',u:n,o:'',desc:ds})}TK('保存成功','s');CL();RPT();RSN()}
function OFP(id){var p=ED[ENV].P.find(function(x){return x.i===id});if(!p)return;if(!confirm('确认下架"'+p.t+'"？'))return;p._off=!0;p.u=N();TK('已下架','i');RPT();RSN()}
function DLP(id){var p=ED[ENV].P.find(function(x){return x.i===id});if(!p||!p._off)return TK('请先下架','e');if(!confirm('永久删除"'+p.t+'"？'))return;ED[ENV].P=ED[ENV].P.filter(function(x){return x.i!==id});delete ED[ENV].R[id];TK('已删除','s');RPT();RSN();if(CP===id){CP=null;RER()}}
function CPL(id){var p=ED[ENV].P.find(function(x){return x.i===id});if(!p)return;var url='https://m.example.com/theme-card?poolId='+p.i;function ok(){TK('链接已复制','s')}function fb(){var ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){TK('复制失败，请手动复制','e')}document.body.removeChild(ta)}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(ok,fb)}else{fb()}}

// resource page
function RRP(pid){var p=ED[ENV].P.find(function(x){return x.i===pid});if(!p)return;if(!ED[ENV].R[pid])ED[ENV].R[pid]=[];$('#top-bar').innerHTML=ENVH();$('#ca').innerHTML='<div class="cb"><div class="tb"><input placeholder="搜索玩法名/玩法ID" id="rs_'+pid+'" oninput="RRT('+pid+')"><select id="rcs_'+pid+'" onchange="RRT('+pid+')"><option value="">全部配置状态</option><option value="草稿">草稿</option><option value="已上架">已上架</option><option value="已下架">已下架</option></select><select id="res_'+pid+'" onchange="RRT('+pid+')"><option value="">全部生效状态</option><option value="生效中">生效中</option><option value="待生效">待生效</option><option value="已失效">已失效</option></select><div style="display:flex;gap:8px;margin-left:auto"><button class="btn bs" onclick="ORM('+pid+',null,\'工坊玩法\')">+ 添加工坊玩法</button><button class="btn bp" onclick="ORM('+pid+',null,\'共创玩法\')">+ 添加共创玩法</button></div></div><div class="tw" id="rT_'+pid+'"></div></div>';RRT(pid)}
function RRT(pid){var s=($('#rs_'+pid)?$('#rs_'+pid).value:'').toLowerCase(),cs=$('#rcs_'+pid)?$('#rcs_'+pid).value:'',es=$('#res_'+pid)?$('#res_'+pid).value:'';var list=(ED[ENV].R[pid]||[]).slice();if(s)list=list.filter(function(r){return r.gn.toLowerCase().indexOf(s)>=0||r.gi.toLowerCase().indexOf(s)>=0});if(cs)list=list.filter(function(r){return r.cs===cs});if(es)list=list.filter(function(r){return r.es===es});var w=$('#rT_'+pid);if(!w)return;if(!list.length){w.innerHTML='<div class="es">暂无数据</div>';return}function cst(v){if(v==='已上架')return'<span class="tag tbl">已上架</span>';if(v==='已下架')return'<span class="tag tgy">已下架</span>';return'<span class="tag tor">草稿</span>'}function est(v){if(v==='生效中')return'<span class="tag tgr">生效中</span>';if(v==='待生效')return'<span class="tag tor">待生效</span>';return'<span class="tag tre">已失效</span>'}w.innerHTML='<table><thead><tr><th>资源ID</th><th>玩法名</th><th>玩法ID</th><th>玩法封面</th><th>生效时间区间</th><th>置顶顺序</th><th>配置状态</th><th>生效状态</th><th>更新时间</th><th>操作人</th><th>操作</th></tr></thead><tbody>'+list.map(function(r){return'<tr><td>'+r.ri+'</td><td>'+ES(r.gn)+'</td><td>'+r.gi+'</td><td>'+(r.cv?'<img class="ct" src="'+ES(r.cv)+'" onerror="this.style.display=\'none\'">':'<div style="width:48px;height:36px;border-radius:4px;background:'+GCH(r.gi)+';display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(0,0,0,.2)">封面</div>')+'</td><td>'+r.ss+' ~ '+r.se+'</td><td>'+r.pi+'</td><td>'+cst(r.cs)+'</td><td>'+est(r.es)+'</td><td>'+r.up+'</td><td>'+r.op+'</td><td><div class="ops"><button class="btn bsm bl" onclick="ORM('+pid+','+r.ri+',\''+(r.src||'共创玩法')+'\')">修改</button><button class="btn bsm bl" onclick="OFR('+pid+','+r.ri+')">下架</button><button class="btn bsm bl" onclick="DLR('+pid+','+r.ri+')">删除</button><button class="btn bsm bl" onclick="VLG('+pid+','+r.ri+')">操作日志</button></div></td></tr>'}).join('')+'</tbody></table>'}
function ORM(pid,rid,src){var ed=rid!=null,r=ed?ED[ENV].R[pid].find(function(x){return x.ri===rid}):null;window._gpid=pid;window._grid=rid;window._gsrc=src;var sg=ed?{gn:r.gn,gi:r.gi,cv:r.cv}:window._selG||null;var iv=ed?(r.iv||0):0;var b='<div class="fg"><label>玩法封面</label>';if(sg&&sg.cv){b+='<div class="gp"><img src="'+ES(sg.cv)+'" onerror="this.parentElement.innerHTML=\'<span>封面加载失败</span>\'"></div>'}else{b+='<div class="gp"><span>16:9 封面占位图</span></div>'}b+='</div><div class="fg"><button class="btn bp" onclick="GPK()">选择玩法</button></div>';b+='<div class="fg"><label><span class="rq">*</span>玩法名</label><input id="rGN" value="'+(sg?ES(sg.gn):'')+'" placeholder="自动拉取" readonly disabled class="ro"></div>';b+='<div class="fg"><label><span class="rq">*</span>玩法ID</label><input id="rGI" value="'+(sg?sg.gi:'')+'" placeholder="自动拉取" readonly disabled class="ro"></div>';b+='<div class="fg"><label>是否干预</label><div class="rg"><label><input type="radio" name="rIV" value="0"'+(iv?'':' checked')+' onchange="TIV()"> 否</label><label><input type="radio" name="rIV" value="1"'+(iv?' checked':'')+' onchange="TIV()"> 是</label></div></div>';b+='<div id="rIVF" style="display:'+(iv?'block':'none')+'"><div class="fr"><div class="fg"><label>生效开始时间</label><input id="rSS" type="datetime-local" value="'+(ed?r.ss:'')+'"></div><div class="fg"><label>生效结束时间</label><input id="rSE" type="datetime-local" value="'+(ed?r.se:'')+'"></div></div><div class="fg"><label>置顶顺序</label><input id="rPI" type="number" value="'+(ed?r.pi||0:0)+'" min="0" placeholder="数字越大越靠前"></div></div>';OM((ed?'修改':'添加')+'资源 - '+src,b,'<button class="btn bdf" onclick="CL()">取消</button><button class="btn bdf" onclick="SVR('+pid+','+(ed?rid:'null')+',\''+src+'\',0)">保存</button><button class="btn bp" onclick="SVR('+pid+','+(ed?rid:'null')+',\''+src+'\',1)">发布</button>')}
function SVR(pid,rid,src,pub){var sg=window._selG||(rid!=null?{gn:$('#rGN').value,gi:$('#rGI').value}:null);if(!sg||!sg.gi)return TK('请先选择玩法','e');var iv=parseInt((document.querySelector('input[name="rIV"]:checked')||{}).value||0);var ss='',se='',pi=0;if(iv){ss=$('#rSS').value;se=$('#rSE').value;pi=parseInt($('#rPI').value)||0;if(!ss||!se)return TK('干预模式下请填写生效时间区间','e')}var cs=pub?'已上架':'草稿';var es='待生效';if(cs==='已上架'){var td=N();if(ss&&ss>td)es='待生效';else if(se&&se<td)es='已失效';else es='生效中'}var n=N();if(rid!=null){var r=ED[ENV].R[pid].find(function(x){return x.ri===rid});r.lg.push({t:n,a:pub?'发布资源':'修改资源',o:r.op||''});Object.assign(r,{gn:sg.gn,gi:sg.gi,cv:sg.cv||'',ss:ss,se:se,pi:pi,iv:iv,cs:cs,es:es,up:n,src:src})}else{var nid=ED[ENV].RN[pid]||1;ED[ENV].RN[pid]=nid+1;ED[ENV].R[pid].push({ri:nid,gn:sg.gn,gi:sg.gi,cv:sg.cv||'',ss:ss,se:se,pi:pi,iv:iv,cs:cs,es:es,up:n,op:'',src:src,lg:[{t:n,a:pub?'创建并发布':'创建草稿',o:''}]})}TK(pub?'发布成功':'保存成功','s');CL();RRT(pid)}function GPK(){var b='<div class="tb"><input placeholder="搜索玩法名/玩法ID" id="gs_x" oninput="GPR()"></div><div id="gpr_x"></div>';OM('选择玩法',b,'<button class="btn bdf" onclick="CL()">取消</button>');GPR()}function GPR(){var s=($('#gs_x')?$('#gs_x').value:'').toLowerCase();var f=GP.filter(function(g){return g.gn.toLowerCase().indexOf(s)>=0||g.gi.toLowerCase().indexOf(s)>=0});var w=$('#gpr_x');if(!w)return;if(!f.length){w.innerHTML='<div class="es">未找到玩法</div>';return}w.innerHTML=f.map(function(g){return'<div class="gpi" data-gi="'+g.gi+'" data-gn="'+ES(g.gn)+'" data-cv="'+g.cv+'" onclick="GPS(this)"><img src="'+g.cv+'" onerror="this.style.display=\\\'none\\\'"><div class="gi"><div class="gn">'+ES(g.gn)+'</div><div class="gid">'+g.gi+'</div></div></div>'}).join('')}function GPS(el){window._selG={gn:el.dataset.gn,gi:el.dataset.gi,cv:el.dataset.cv};CL();ORM(window._gpid,window._grid,window._gsrc)}function TIV(){var iv=(document.querySelector('input[name="rIV"]:checked')||{}).value;$('#rIVF').style.display=iv==='1'?'block':'none'}
function GCH(s){var h=0;for(var i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);return'hsl('+Math.abs(h%360)+',55%,78%)'}function OFR(pid,rid){var r=ED[ENV].R[pid].find(function(x){return x.ri===rid});if(!r)return;if(!confirm('确认下架'+r.gn+'？'))return;r.cs='已下架';r.es='已失效';r.up=N();r.lg.push({t:r.up,a:'下架资源',o:r.op});TK('已下架','i');RRT(pid)}
function DLR(pid,rid){var r=ED[ENV].R[pid].find(function(x){return x.ri===rid});if(!r)return;if(!confirm('永久删除'+r.gn+'？'))return;ED[ENV].R[pid]=ED[ENV].R[pid].filter(function(x){return x.ri!==rid});TK('已删除','s');RRT(pid)}
function VLG(pid,rid){var r=ED[ENV].R[pid].find(function(x){return x.ri===rid});if(!r)return;var logs=r.lg||[];var b='<div style="font-size:13px">'+(logs.length?logs.map(function(l){return'<div class="li"><span class="lt">'+l.t+'</span><span>'+l.a+'</span><span style="color:#1890ff">'+l.o+'</span></div>'}).join(''):'<div class="es" style="padding:30px">暂无操作日志</div>')+'</div>';OM('操作日志 - '+r.gn,b,'<button class="btn bdf" onclick="CL()">关闭</button>',true)}
